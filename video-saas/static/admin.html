<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影速 · 管理控制台</title><link rel="stylesheet" href="/static/style.css"></head><body class="admin-body"><header class="site-header"><a class="brand" href="/"><span class="brand-icon">▶</span><span>影速 <small>ADMIN CONSOLE</small></span></a><nav><a class="nav-link" href="/">← 返回前台</a></nav><span class="header-tag">管理员区域</span></header>
<main class="admin-wrap"><div id="login-view" class="login-box"><div class="panel-kicker">SECURE SIGN IN</div><h1>管理后台</h1><p class="muted">使用部署时设置的管理员密码登录</p><form id="admin-login-form"><label for="admin-password">管理员密码</label><input id="admin-password" type="password" required autocomplete="current-password" placeholder="输入管理员密码"><button class="primary-button full-width" type="submit">登录管理后台 →</button></form><p class="error-msg" id="login-error" hidden></p><a href="/" class="muted">返回视频工作台</a></div>
<div id="dashboard-view" hidden><div class="dashboard-heading"><div><span class="panel-kicker">OVERVIEW</span><h1>运营总览</h1><p class="muted">实时任务统计 · 下载任务管理</p></div><div class="dashboard-actions"><button class="outline-button" id="refresh-btn">刷新数据 ↻</button><button class="outline-button" id="logout-btn">退出登录</button></div></div><div class="stats-grid"><div class="stat"><span>累计任务</span><strong id="total-count">—</strong><small>全部提交任务</small></div><div class="stat"><span>成功处理</span><strong id="done-count">—</strong><small>处理完成</small></div><div class="stat"><span>进行中</span><strong id="pending-count">—</strong><small>排队 / 下载中</small></div><div class="stat"><span>失败任务</span><strong id="failed-count">—</strong><small>错误与限制</small></div></div><section class="table-panel"><div class="table-title"><h2>近期任务</h2><span>最近 100 条</span></div><div class="table-scroll"><table><thead><tr><th>提交时间</th><th>来源链接</th><th>状态</th><th>进度</th><th>操作</th></tr></thead><tbody id="jobs-body"><tr><td colspan="5">正在读取…</td></tr></tbody></table></div></section><div class="notice-panel"><div class="notice-symbol">ⓘ</div><p>本版本为单实例 MVP，适合小流量验证。公开上线前应补充防刷、访问审计、报警、版权投诉工单与容器出口网络防护。</p></div></div></main><script src="/static/admin.js" defer></script></body></html>
